name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  # Mengizinkan build manual melalui tombol "Run workflow" di GitHub Actions UI
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup JDK 17 (Standar untuk modern Android Gradle Plugin 8.x+)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Beri izin eksekusi pada wrapper gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Compile dan Build Debug APK
      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      # 5. Upload hasil APK ke GitHub Actions Artifacts agar bisa langsung diunduh
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wireless-harvester-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
